[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.4.0"
description = "Local-first static risk checks for MCP and agent configuration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MCP Guard contributors"}]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
