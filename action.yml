name: MCP Guard

description: Local-first static risk checks for MCP and agent configuration
inputs:
  path:
    description: JSON or JSONC MCP configuration or explicit Registry server.json path
    required: false
    default: .mcp.json
  paths:
    description: Multiline list of JSON or JSONC MCP configuration paths; each non-empty line is one path
    required: false
    default: ''
  output:
    description: SARIF output path
    required: false
    default: mcp-guard.sarif
  artifact-name:
    description: Uploaded artifact name
    required: false
    default: mcp-guard-sarif
  upload-artifact:
    description: Upload the SARIF file as a workflow artifact
    required: false
    default: 'true'
  upload-sarif:
    description: Upload the SARIF file to GitHub Code Scanning
    required: false
    default: 'false'
  category:
    description: Code Scanning category when upload-sarif is enabled
    required: false
    default: mcp-guard
  selector:
    description: Exact JSON path for the server map when multiple maps exist, for example $.config.mcpServers
    required: false
    default: ''
  input-format:
    description: Input schema to scan (mcp-json or explicit MCP Registry server.json)
    required: false
    default: mcp-json
  baseline:
    description: Optional reviewed baseline file; findings it lists are left out of SARIF and the failure gate
    required: false
    default: ''
  fail-on:
    description: Minimum severity that fails the action
    required: false
    default: high
runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        MCP_GUARD_PATH: ${{ inputs.path }}
        MCP_GUARD_PATHS: ${{ inputs.paths }}
        MCP_GUARD_OUTPUT: ${{ inputs.output }}
        MCP_GUARD_SELECTOR: ${{ inputs.selector }}
        MCP_GUARD_INPUT_FORMAT: ${{ inputs.input-format }}
        MCP_GUARD_FAIL_ON: ${{ inputs.fail-on }}
        MCP_GUARD_BASELINE: ${{ inputs.baseline }}
        MCP_GUARD_SOURCE_ROOT: ${{ github.workspace }}
      run: |
        set +e
        scan_paths=()
        if [ -n "$MCP_GUARD_PATHS" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^[[:space:]]*$ ]]; then
              continue
            fi
            line=${line%$'\r'}
            scan_paths+=("$line")
          done <<< "$MCP_GUARD_PATHS"
        fi
        if [ "${#scan_paths[@]}" -eq 0 ]; then
          scan_paths+=("$MCP_GUARD_PATH")
        fi
        scan_command=(python -m mcp_guard.cli scan --format sarif --output "$MCP_GUARD_OUTPUT")
        if [ -n "$MCP_GUARD_SELECTOR" ]; then
          scan_command+=(--selector "$MCP_GUARD_SELECTOR")
        fi
        if [ -n "$MCP_GUARD_BASELINE" ]; then
          scan_command+=(--baseline "$MCP_GUARD_BASELINE")
        fi
        scan_command+=(--input-format "$MCP_GUARD_INPUT_FORMAT" --fail-on "$MCP_GUARD_FAIL_ON")
        if [ "${#scan_paths[@]}" -gt 1 ]; then
          scan_command+=(--source-root "$MCP_GUARD_SOURCE_ROOT")
        fi
        scan_command+=(-- "${scan_paths[@]}")
        PYTHONPATH="${{ github.action_path }}/src" "${scan_command[@]}"
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ "$status" -gt 1 ]; then
          exit "$status"
        fi
    - if: always() && inputs.upload-sarif == 'true' && steps.scan.outputs.status != '2'
      uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
      with:
        sarif_file: ${{ inputs.output }}
        category: ${{ inputs.category }}
    - if: always() && inputs.upload-artifact == 'true' && steps.scan.outputs.status != '2'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
        if-no-files-found: error
    - if: steps.scan.outputs.status == '1'
      shell: bash
      run: exit 1
