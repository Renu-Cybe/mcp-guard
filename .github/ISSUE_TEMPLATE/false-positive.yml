name: False positive
description: Report a finding that does not match the stated risk pattern.
title: "[False positive]: "
body:
  - type: input
    id: version
    attributes:
      label: MCP Guard version
      placeholder: v0.1.5 or commit SHA
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: MCPG005
    validations:
      required: true
  - type: textarea
    id: sanitized_config
    attributes:
      label: Sanitized configuration
      description: Remove tokens, private URLs, personal data, and proprietary values before posting.
      render: json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual finding
      description: Include the reported path, severity, and evidence after redaction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
