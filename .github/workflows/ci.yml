name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: package build and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          smoke-venv/bin/mcp-guard --version
          smoke-venv/bin/python -c "import mcp_guard; print(mcp_guard.__version__)"

  test:
    name: pytest / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Verify installed CLI
        run: mcp-guard --help

  action-e2e:
    name: local GitHub Action / SARIF and gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Safe fixture has no findings
        env:
          PYTHONPATH: src
        run: python -m mcp_guard.cli scan tests/fixtures/safe.json --format json
      - name: Prepare a fixture with a space in its path
        run: cp tests/corpus/fixtures/private-metadata.json "tests/corpus/fixtures/private metadata.json"
      - name: Prepare a fixture with shell metacharacters in its path
        run: cp tests/corpus/fixtures/private-metadata.json 'tests/corpus/fixtures/literal $(touch mcp-guard-path-injection-marker).json'
      - name: Action paths input preserves literal paths and SARIF sources
        id: paths
        continue-on-error: true
        uses: ./
        with:
          paths: |
            tests/fixtures/high-risk.json
            tests/corpus/fixtures/private metadata.json
            tests/corpus/fixtures/literal $(touch mcp-guard-path-injection-marker).json
          path: tests/fixtures/safe.json
          output: mcp-guard-action-paths.sarif
          upload-artifact: false
      - name: Verify action paths input
        if: always()
        env:
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
        run: |
          test "$PATHS_OUTCOME" = failure
          test -s mcp-guard-action-paths.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("mcp-guard-action-paths.sarif").read_text())
          results = report["runs"][0]["results"]
          assert results
          assert all("mcpGuard/v2" in item["fingerprints"] for item in results)
          assert {item["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for item in results} == {
              "tests/fixtures/high-risk.json", "tests/corpus/fixtures/private metadata.json",
              "tests/corpus/fixtures/literal $(touch mcp-guard-path-injection-marker).json"
          }
          PY
          test ! -e mcp-guard-path-injection-marker
      - name: Multi-file scan keeps source-aware findings deterministic
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m mcp_guard.cli scan tests/corpus/fixtures/docker-host.json tests/corpus/fixtures/private-metadata.json --format sarif --output mcp-guard-multi.sarif
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("mcp-guard-multi.sarif").read_text())
          results = report["runs"][0]["results"]
          assert results
          assert all("mcpGuard/v2" in item["fingerprints"] for item in results)
          assert {item["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for item in results} == {
              "docker-host.json", "private-metadata.json"
          }
          PY
      - name: Scan high-risk fixture with local action
        id: high-risk
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/high-risk.json
          output: mcp-guard-high-risk.sarif
      - name: Verify SARIF artifact and failure gate
        if: always()
        env:
          HIGH_RISK_OUTCOME: ${{ steps.high-risk.outcome }}
        run: |
          test "$HIGH_RISK_OUTCOME" = failure
          test -s mcp-guard-high-risk.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("mcp-guard-high-risk.sarif").read_text())
          results = report["runs"][0]["results"]
          rule_ids = {item["ruleId"] for item in results}
          assert {"MCPG001", "MCPG002", "MCPG004"} <= rule_ids
          assert "not-a-real-secret" not in Path("mcp-guard-high-risk.sarif").read_text()
          PY
      - name: Medium-only fixture fails when threshold is medium
        id: medium-threshold
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/medium-only.json
          output: mcp-guard-medium.sarif
          fail-on: medium
          upload-artifact: false
      - name: Verify configurable medium threshold
        if: always()
        env:
          MEDIUM_OUTCOME: ${{ steps.medium-threshold.outcome }}
        run: |
          test "$MEDIUM_OUTCOME" = failure
          test -s mcp-guard-medium.sarif
      - name: Selector chooses an explicit nested server map
        id: selector
        uses: ./
        with:
          path: tests/fixtures/ambiguous.json
          selector: $.config.mcpServers
          output: mcp-guard-selector.sarif
          upload-artifact: false
      - name: Verify selector forwarding
        env:
          SELECTOR_OUTCOME: ${{ steps.selector.outcome }}
        run: |
          test "$SELECTOR_OUTCOME" = success
          test -s mcp-guard-selector.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("mcp-guard-selector.sarif").read_text())
          assert {item["ruleId"] for item in report["runs"][0]["results"]} == {"MCPG005"}
          PY
      - name: D2 authenticated remote fixture stays clean
        id: d2-safe
        uses: ./
        with:
          path: tests/corpus/fixtures/remote-auth.json
          output: mcp-guard-d2-safe.sarif
          upload-artifact: false
      - name: Verify D2 false-positive fixture
        run: |
          test -s mcp-guard-d2-safe.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("mcp-guard-d2-safe.sarif").read_text())
          assert report["runs"][0]["results"] == []
          PY
      - name: D2 metadata fixture fails on high severity
        id: d2-risk
        continue-on-error: true
        uses: ./
        with:
          path: tests/corpus/fixtures/private-metadata.json
          output: mcp-guard-d2-risk.sarif
          upload-artifact: false
      - name: Verify D2 risk fixture
        if: always()
        env:
          D2_RISK_OUTCOME: ${{ steps.d2-risk.outcome }}
        run: |
          test "$D2_RISK_OUTCOME" = failure
          test -s mcp-guard-d2-risk.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("mcp-guard-d2-risk.sarif").read_text())
          assert {item["ruleId"] for item in report["runs"][0]["results"]} == {"MCPG004", "MCPG006"}
          PY
      - name: Registry adapter keeps pinned package and OAuth remote clean
        id: registry-safe
        uses: ./
        with:
          path: tests/corpus/fixtures/registry-pinned-clean.json
          input-format: registry
          output: mcp-guard-registry-safe.sarif
          upload-artifact: false
      - name: Registry adapter reports missing remote auth
        id: registry-risk
        continue-on-error: true
        uses: ./
        with:
          path: tests/corpus/fixtures/registry-missing-auth.json
          input-format: registry
          fail-on: medium
          output: mcp-guard-registry-risk.sarif
          upload-artifact: false
      - name: Verify registry adapter forwarding
        if: always()
        env:
          REGISTRY_SAFE_OUTCOME: ${{ steps.registry-safe.outcome }}
          REGISTRY_RISK_OUTCOME: ${{ steps.registry-risk.outcome }}
        run: |
          test "$REGISTRY_SAFE_OUTCOME" = success
          test "$REGISTRY_RISK_OUTCOME" = failure
          test -s mcp-guard-registry-safe.sarif
          test -s mcp-guard-registry-risk.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          safe = json.loads(Path("mcp-guard-registry-safe.sarif").read_text())
          risk = json.loads(Path("mcp-guard-registry-risk.sarif").read_text())
          assert safe["runs"][0]["results"] == []
          assert {item["ruleId"] for item in risk["runs"][0]["results"]} == {"MCPG006"}
          assert risk["runs"][0]["results"][0]["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] == "tests/corpus/fixtures/registry-missing-auth.json"
          PY
      - name: Registry paths input rejects multiple files and creates no output
        id: registry-paths
        continue-on-error: true
        uses: ./
        with:
          paths: |
            tests/corpus/fixtures/registry-missing-auth.json
            tests/corpus/fixtures/registry-pinned-clean.json
          input-format: registry
          output: mcp-guard-registry-paths.sarif
          artifact-name: mcp-guard-registry-paths
      - name: Verify registry paths fail closed without SARIF
        if: always()
        env:
          REGISTRY_PATHS_OUTCOME: ${{ steps.registry-paths.outcome }}
        run: |
          test "$REGISTRY_PATHS_OUTCOME" = failure
          test ! -e mcp-guard-registry-paths.sarif
      - name: Registry adapter rejects unknown schema
        id: registry-invalid
        continue-on-error: true
        uses: ./
        with:
          path: tests/corpus/fixtures/registry-unknown-schema.json
          input-format: registry
          upload-artifact: false
      - name: Verify registry invalid input fails closed
        env:
          REGISTRY_INVALID_OUTCOME: ${{ steps.registry-invalid.outcome }}
        run: test "$REGISTRY_INVALID_OUTCOME" = failure

  artifact-e2e:
    name: downloaded SARIF artifact
    needs: action-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Download uploaded SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-guard-sarif
          path: downloaded-artifact
      - name: Verify uploaded artifact contents
        run: |
          test -s downloaded-artifact/mcp-guard-high-risk.sarif
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("downloaded-artifact/mcp-guard-high-risk.sarif").read_text())
          assert report["runs"][0]["tool"]["driver"]["name"] == "mcp-guard"
          assert "not-a-real-secret" not in Path("downloaded-artifact/mcp-guard-high-risk.sarif").read_text()
          PY
      - name: Confirm invalid multi-file registry scan has no artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-guard-registry-paths
          path: invalid-registry-artifact
          if-no-artifact-found: ignore
      - name: Verify invalid action did not upload an artifact
        run: test ! -e invalid-registry-artifact/mcp-guard-registry-paths.sarif
