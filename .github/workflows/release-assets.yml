name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and release
        required: true
        type: string
      dry_run:
        description: Build and validate without changing the GitHub Release
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assets:
    name: build and attach release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$package_version" = "${RELEASE_TAG#v}"

      - name: Build and validate distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > SHA256SUMS

      - name: Show dry-run assets
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat SHA256SUMS

      - name: Create release if needed
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Attach non-conflicting assets
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/* SHA256SUMS; do
            name=$(basename "$file")
            local_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            remote_digest=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$name\") | .digest" | head -n1)
            if [ -n "$remote_digest" ]; then
              test "$remote_digest" = "$local_digest"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
